<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cash Control v1.1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="brand">
                <div class="app-icon"><span>$</span></div>
                <div class="brand-text">
                    <h1>Smart Cash</h1>
                    <span class="version-tag">Control v1.1</span>
                </div>
            </div>
            <div id="header-date" class="date-chip">Cargando...</div>
        </div>
    </header>

    <main id="app-container">
        <section id="view-counter" class="view">
            <div class="card">
                <h3>1. Efectivo en Cajón</h3>
                <div class="input-group">
                    <label>Fondo de Caja (Cambio Actual) (€)</label>
                    <input type="number" id="initial-balance" placeholder="0.00" step="0.01" oninput="app.calculateTotal()" inputmode="decimal">
                </div>
                <div id="denominations-container"></div>
                <div class="total-row">
                    <span>Subtotal Monedas/Billetes:</span>
                    <span id="total-counted" class="amount">€0.00</span>
                </div>
            </div>

            <div class="card">
                <h3>2. Reserva / Recaudación</h3>
                <div class="input-group">
                    <label>Caja Fuerte (€)</label>
                    <input type="number" id="safe-amount" placeholder="0.00" step="0.01" oninput="app.calculateTotal()" inputmode="decimal">
                </div>
            </div>

            <div class="card highlighted">
                <h3>3. Conciliación de Efectivo</h3>
                <div class="input-group">
                    <label>Total Caja Real (Cajón + Fuerte) - [A]</label>
                    <input type="number" id="total-cash-combined" readonly class="readonly-input">
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Fondo Ayer (€)</label>
                        <input type="number" id="fondo-ayer" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>Ventas TPV (€)</label>
                        <input type="number" id="ventas-efectivo" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                </div>
                <div class="input-group">
                    <label>Total Caja Teórica (Fondo + Ventas) - [B]</label>
                    <input type="number" id="total-caja-b" readonly class="readonly-input">
                </div>
                <div class="result-row">
                    <span>Diferencia Caja (A-B):</span>
                    <span id="diff-caja-total" class="status-badge">€0.00</span>
                </div>
            </div>

            <div class="card">
                <h3>4. Conciliación Datafono</h3>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Cierre Datafono (€)</label>
                        <input type="number" id="cierre-datafono" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>Reporte Z (€)</label>
                        <input type="number" id="reporte-z" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                </div>
                <div class="result-row">
                    <span>Diferencia Datafono:</span>
                    <span id="diff-datafono" class="status-badge">€0.00</span>
                </div>
                
                <textarea id="observations" placeholder="Notas sobre el cierre..."></textarea>
                
                <div class="actions-stack">
                    <button class="btn-primary" onclick="app.saveClosing()">Confirmar Cierre</button>
                    <button class="btn-whatsapp" onclick="app.shareWhatsApp()">Enviar a WhatsApp</button>
                </div>
            </div>
        </section>

        <section id="view-history" class="view hidden">
            <header class="section-header">
                <h2>Historial de Cierres</h2>
            </header>
            <div id="history-list"></div>
        </section>
    </main>

    <nav class="dock-container">
        <div class="dock">
            <button onclick="app.switchView('counter')" class="dock-item active" id="tab-counter">
                <div class="icon-box">🏦</div>
                <span>Caja</span>
            </button>
            <button onclick="app.switchView('history')" class="dock-item" id="tab-history">
                <div class="icon-box">📜</div>
                <span>Historial</span>
            </button>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
