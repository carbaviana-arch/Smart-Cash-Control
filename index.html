<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Cash Control v2.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="brand">
                <div class="app-icon"><span>$</span></div>
                <div class="brand-text">
                    <h1>Smart Cash</h1>
                    <span class="version-tag">Control v2.0 • Pro</span>
                </div>
            </div>
            <div id="header-date" class="date-chip">...</div>
        </div>
    </header>

    <main id="app-container">
        <section id="view-counter" class="view">
            
            <div class="card summary-card">
                <h3>Resumen Cierre (Contabilidad)</h3>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Fondo Ayer (€)</label>
                        <input type="number" id="resumen-fondo-ayer" value="0" oninput="app.calculateResumen()" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>Visa (€)</label>
                        <input type="number" id="resumen-visa" value="0" oninput="app.calculateResumen()" inputmode="decimal">
                    </div>
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Efectivo (€)</label>
                        <input type="number" id="resumen-efectivo" value="0" oninput="app.calculateResumen()" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>Sobre (€)</label>
                        <input type="number" id="resumen-sobre" value="0" oninput="app.calculateResumen()" inputmode="decimal">
                    </div>
                </div>
                <div class="input-group">
                    <label>Gastos Totales (€)</label>
                    <input type="number" id="resumen-gastos" value="0" oninput="app.calculateResumen()" inputmode="decimal">
                </div>
                <div class="input-group">
                    <label>Detalle de Gastos (Compras/Pagos)</label>
                    <textarea id="resumen-detalle-gastos" placeholder="Ej: Mercadona 20€, Reparación 15€..." style="height: 60px;"></textarea>
                </div>
                <div class="result-row highlighted-result">
                    <span>FONDO HOY (Final):</span>
                    <span id="resumen-fondo-hoy" class="amount-large">€0.00</span>
                </div>
            </div>

            <div class="card">
                <h3>1. Efectivo en Cajón (Desglose)</h3>
                <div id="denominations-container"></div>
                <div class="total-row">
                    <span>Subtotal Monedas/Billetes:</span>
                    <span id="total-counted" class="amount">€0.00</span>
                </div>
            </div>

            <div class="card highlighted">
                <h3>2. Conciliación TPV vs Real</h3>
                <div class="input-group">
                    <label>Total Real en Caja [A]</label>
                    <input type="number" id="total-cash-combined" readonly class="readonly-input">
                </div>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Fondo Inicial (€)</label>
                        <input type="number" id="fondo-ayer" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                    <div class="input-group">
                        <label>Ventas TPV (€)</label>
                        <input type="number" id="ventas-efectivo" placeholder="0.00" oninput="app.calculateTotal()" inputmode="decimal">
                    </div>
                </div>
                <div class="result-row">
                    <span>Diferencia:</span>
                    <span id="diff-caja-total" class="status-badge">€0.00</span>
                </div>
            </div>

            <div class="card">
                <h3>3. Acciones y Archivos</h3>
                <textarea id="observations" placeholder="Observaciones generales..."></textarea>
                <div class="actions-stack">
                    <button class="btn-primary" onclick="app.saveClosing()">💾 Guardar Cierre</button>
                    <div class="row-flex">
                        <button class="btn-file" onclick="app.exportToJSON()">📤 Exportar</button>
                        <button class="btn-file" onclick="document.getElementById('importFile').click()">📥 Importar</button>
                    </div>
                    <input type="file" id="importFile" style="display:none" accept=".json" onchange="app.importFromJSON(event)">
                    <button class="btn-whatsapp" onclick="app.shareWhatsApp()">🟢 Enviar WhatsApp</button>
                </div>
            </div>
        </section>

        <section id="view-history" class="view hidden">
            <header class="section-header"><h2>Historial</h2></header>
            <div id="history-list"></div>
        </section>
    </main>

    <nav class="dock-container">
        <div class="dock">
            <button onclick="app.switchView('counter')" class="dock-item active" id="tab-counter">
                <div class="icon-box">🏦</div><span>Caja</span>
            </button>
            <button onclick="app.switchView('history')" class="dock-item" id="tab-history">
                <div class="icon-box">📜</div><span>Historial</span>
            </button>
        </div>
    </nav>

    <script src="app.js"></script>
</body>
</html>
