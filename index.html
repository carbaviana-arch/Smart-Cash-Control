<div class="card">
                <h3>4. Conciliación Datafono</h3>
                <div class="row-flex">
                    <div class="input-group">
                        <label>Cierre Datafono (€)</label>
                        <input type="number" id="cierre-datafono" placeholder="0.00" oninput="app.calculateTotal()">
                    </div>
                    <div class="input-group">
                        <label>Reporte Z (Tarjetas) (€)</label>
                        <input type="number" id="reporte-z" placeholder="0.00" oninput="app.calculateTotal()">
                    </div>
                </div>
                <div class="result-row">
                    <span>Diferencia Datafono:</span>
                    <span id="diff-datafono" class="status-badge">€0.00</span>
                </div>
                <textarea id="observations" placeholder="Observaciones de descuadres..."></textarea>
                
                <div class="actions-stack">
                    <button class="btn-primary" onclick="app.saveClosing()">Confirmar Cierre v1.1</button>
                    <button class="btn-whatsapp" id="btn-share-wa" onclick="app.shareWhatsApp()">
                        <span>Enviar Resumen a WhatsApp</span>
                    </button>
                </div>
            </div>
